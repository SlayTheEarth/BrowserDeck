name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: browserdeck-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
          if [[ ! -f "$SDK_ROOT/platforms/android-37/android.jar" || ! -x "$SDK_ROOT/build-tools/36.0.0/aapt2" ]]; then
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-37' 'build-tools;36.0.0'
          fi
          test -f "$SDK_ROOT/platforms/android-37/android.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt2"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/BrowserDeck-v0.2.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BrowserDeck-v0.2-debug
          path: dist/BrowserDeck-v0.2.0-debug.apk
          if-no-files-found: error
      - name: Publish test release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.2.0 already exists; not replacing the published APK."
          else
            gh release create v0.2.0 dist/BrowserDeck-v0.2.0-debug.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "BrowserDeck v0.2.0" --prerelease --notes "Experimental GeckoView browser engine, selectable WebView fallback, shared-memory diagnostics and existing controller profiles. Hardware compatibility untested."
          fi
