plugins { id 'com.android.application' }
android {
    namespace 'com.browserdeck.launcher'
    compileSdk 37
    defaultConfig { applicationId 'com.browserdeck.launcher'; minSdk 26; targetSdk 34; versionCode 2; versionName '0.2.0'; ndk { abiFilters 'arm64-v8a' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1'; implementation 'org.mozilla.geckoview:geckoview:160.0.20261116130455' }
